name: Build on main/stable push
permissions:
  contents: read

on:
  push:
    branches: [main, stable]
    tags:
      - '!v*'
  workflow_dispatch:

jobs:
  build:
    if: github.repository != 'felixfoertsch/HeroicGamesLauncher'
    uses: ./.github/workflows/build-base.yml
    with:
      publish-snap: false
    secrets:
      snapcraftIdEdge: ${{ secrets.SNAPCRAFT_ID_EDGE }}
      workflowToken: ${{ secrets.GITHUB_TOKEN }}
