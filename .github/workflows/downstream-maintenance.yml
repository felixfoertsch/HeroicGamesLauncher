name: Downstream release maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/downstream/release_cleanup.py'
      - '.github/downstream/release_notes.py'
      - '.github/downstream/disable_cla.py'
      - '.github/downstream/test_disable_cla.py'
      - '.github/workflows/downstream-maintenance.yml'
      - '.github/workflows/cla.yml'
  workflow_run:
    workflows: [Downstream Heroic]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroic-downstream-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      github.repository == 'felixfoertsch/HeroicGamesLauncher' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out trusted main, never a PR or workflow artifact
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test downstream maintenance and guarded publication
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/downstream -p 'test_*.py'
      - name: Ensure inherited upstream-only CLA automation stays disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/downstream/disable_cla.py
      - name: Refresh CalVer release descriptions and archive superseded run-ID builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/downstream/release_cleanup.py --apply
